# 【已停用】2026-10 起站点迁到 Cloudflare Pages，本文件不再生效，仅作回退参考。
# 等效的响应头配置已搬到 public/_headers。
#
# Netlify 构建配置 — Astro 静态站点
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
